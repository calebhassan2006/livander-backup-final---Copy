
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales | Livander Store</title>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">LIVANDER</h2>
            <p class="logo-subtitle">Business Management</p>

            <nav>
                <a href="index.html">🏠 Dashboard</a>
                <a href="inventory.html">📦 Inventory</a>
                <a href="sales.html" class="active">💰 Sales</a>
                <a href="finance.html">📊 Finance</a>
                <a href="employees.html">👥 Employees</a>
                <a href="customers.html">🧑 Customers</a>
                <a href="reports.html">📈 Reports</a>
            </nav>

            <button class="logout-btn">🚪 Logout</button>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">

                <div>
                    <h1>Sales Management</h1>
                    <p>Record and manage your business sales</p>
                </div>

            </header>


            <!-- New Sale -->
            <section class="form-section">

                <h2>New Sale</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label for="sale-product">Select Product</label>

                        <select id="sale-product">
                            <option value="">Select a product</option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="sale-quantity">Quantity</label>

                        <input
                            type="number"
                            id="sale-quantity"
                            min="1"
                            placeholder="Enter quantity"
                        >

                    </div>

                </div>


                <button
                    class="primary-btn"
                    id="add-to-sale-btn"
                >
                    ➕ Add to Sale
                </button>

            </section>


            <!-- Current Sale -->
            <section class="table-section">

                <h2>Current Sale</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>

                        </thead>


                        <tbody id="sale-table-body">

                            <!-- Sale items will appear here -->

                        </tbody>

                    </table>

                </div>


                <!-- Sale Summary -->

                <div class="sale-summary">

    <h2>
        Total:
        <span id="sale-total">KES 0</span>
    </h2>

    <div class="cash-payment">

        <label for="cash-received">Cash Received</label>

        <input
            type="number"
            id="cash-received"
            placeholder="Enter cash received"
            min="0"
        >

        <p>
            Change:
            <strong id="sale-change">KES 0</strong>
        </p>

    </div>

    <button
        class="complete-sale-btn"
        id="complete-sale-btn"
    >
        ✅ Complete Sale
    </button>

</div>

            </section>


            <!-- Receipt -->
            <section
                class="receipt-section"
                id="sale-receipt"
                style="display: none;"
            >

            </section>


            <!-- Sales History -->
            <section class="table-section">

                <h2>Sales History</h2>

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Date</th>
                                <th>Items</th>
                                <th>Total Amount</th>
                            </tr>

                        </thead>


                        <tbody id="sales-history-body">

                            <!-- Completed sales will appear here -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
