
<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | Livander Store</title>
    <link rel="stylesheet" href="dashboard.css">
</head><body><div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">LIVANDER</h2>
        <p class="logo-subtitle">Business Management</p>

        <nav>
            <a href="index.html">🏠 Dashboard</a>
            <a href="inventory.html">📦 Inventory</a>
            <a href="sales.html">💰 Sales</a>
            <a href="finance.html">📊 Finance</a>
            <a href="employees.html">👥 Employees</a>
            <a href="customers.html" class="active">🧑 Customers</a>
            <a href="reports.html">📈 Reports</a>
        </nav>

        <button class="logout-btn">🚪 Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="top-header">
            <div>
                <h1>Customer Management</h1>
                <p>Manage your business customers in one place</p>
            </div>
        </header>

        <!-- Add Customer -->
        <section class="form-section">
            <h2>Add New Customer</h2>

            <form id="customer-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="customer-name" placeholder="Enter customer name" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="customer-phone" placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="customer-email" placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label>Physical Address</label>
                        <input type="text" id="customer-address" placeholder="Enter customer address">
                    </div>

                </div>

                <button type="submit" class="primary-btn">
                    ➕ Add Customer
                </button>

            </form>
        </section>

        <!-- Customers Table -->
        <section class="table-section">

            <div class="section-header">
                <h2>Your Customers</h2>
                <input type="text" id="customer-search" placeholder="🔍 Search customer">
            </div>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone Number</th>
                            <th>Email Address</th>
                            <th>Physical Address</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="customer-table-body">
                        <!-- Customers will appear here -->
                    </tbody>

                </table>
            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
